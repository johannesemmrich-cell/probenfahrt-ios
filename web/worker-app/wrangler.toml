name = "probenfahrt-app"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Custom Domain: Cloudflare provisioniert DNS-Eintrag + TLS-Zertifikat
# automatisch, weil mediproben.com (und damit auch die Subdomain
# app.mediproben.com) schon als Zone in diesem Cloudflare-Account liegt.
# Bewusst ein eigener, zweiter Worker statt einer Route auf demselben
# Worker wie web/worker/ - siehe README für die Begründung (getrennte
# Static-Assets-Verzeichnisse pro Worker, saubere Trennung vom
# QR-only-Apotheken-Check-in).
routes = [
  { pattern = "app.mediproben.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"

# Nicht geheim - dieselben Werte wie in web/worker/wrangler.toml (gleicher
# CloudKit-Container). Secrets sind pro Worker getrennt und müssen hier
# zusätzlich per `wrangler secret put` gesetzt werden, auch wenn der Wert
# identisch zum anderen Worker ist:
#   CLOUDKIT_PRIVATE_KEY_PKCS8_BASE64 (gleicher Server-to-Server-Key)
#   SESSION_HMAC_SECRET (signiert das Session-Cookie, NICHT identisch mit
#     dem Verschlüsselungs-Key)
#   WEB_PASSWORD_ENCRYPTION_KEY (AES-256-Key für User.webPasswordEncrypted -
#     muss exakt WebPasswordEncryptionKey.value im iOS-Bundle entsprechen,
#     siehe Probenfahrt/Support/WebPasswordEncryptionKey.swift)
# Seit 2026-09-15 auf "production" umgestellt - siehe web/worker/wrangler.toml
# für die Begründung (Release/TestFlight-Builds schreiben in Production).
[vars]
CONTAINER_IDENTIFIER = "iCloud.com.johannesemmrich.probenfahrt"
CLOUDKIT_ENVIRONMENT = "production"
CLOUDKIT_KEY_ID = "f5ff9c0e2bfa6639536ef44472ff7d88d4def49c8f32e22673e68514b5cfd8bf"
