<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Probenfahrt · Web-App</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f2f7;
    color: #1c1c1e;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f2f2f7; }
    .card { background: #1c1c1e; }
    .muted { color: #8e8e93; }
    button.secondary, button.tab { background: #2c2c2e; color: #f2f2f7; border-color: #3a3a3c; }
    button.tab.active { background: #34c759; color: #fff; }
    input[type="password"], input[type="text"] { background: #1c1c1e; color: #f2f2f7; border-color: #3a3a3c; }
    .row { border-color: #3a3a3c; }
  }
  .card {
    width: 100%;
    max-width: 420px;
    margin-top: 40px;
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center;
  }
  .card.app { max-width: 640px; text-align: left; margin-top: 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0; }
  .muted { color: #6e6e73; font-size: 0.95rem; margin: 0 0 24px; }
  .card.app .muted { margin: 0; }
  button {
    padding: 14px 16px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card:not(.app) button { display: block; width: 100%; margin-bottom: 12px; }
  button.primary { background: #34c759; color: #fff; }
  button.secondary { background: #f2f2f7; color: #1c1c1e; border: 1px solid #d1d1d6; }
  button.icon { padding: 8px 14px; }
  input[type="password"], input[type="text"] {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    border-radius: 14px;
    border: 1px solid #d1d1d6;
    margin-bottom: 12px;
    box-sizing: border-box;
  }
  .field-label { display: block; font-size: 0.8rem; color: #6e6e73; margin-bottom: 4px; }
  label:has(input[type="checkbox"]) { display: block; margin-bottom: 12px; }
  h3 { font-size: 1rem; margin: 20px 0 8px; }
  h3:first-child { margin-top: 0; }
  .error { color: #ff3b30; font-size: 0.95rem; }
  .brand { font-size: 0.75rem; color: #a1a1a6; margin-top: 28px; text-align: center; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  button.tab { flex: 1; background: #f2f2f7; color: #1c1c1e; border: 1px solid #d1d1d6; }
  button.tab.active { background: #34c759; color: #fff; border-color: #34c759; }
  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid #e5e5ea;
  }
  .row:last-child { border-bottom: none; }
  .row .who { font-size: 0.9rem; color: #6e6e73; }
  .lock { color: #ff9500; font-size: 0.85rem; }
  .yes { color: #34c759; }
  .no { color: #6e6e73; }
  .legal-links { text-align: center; margin-top: 16px; font-size: 0.75rem; }
  .legal-links a { color: #a1a1a6; text-decoration: none; }
  .legal-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="muted" id="loading">Lade…</div>
  </div>
  <div class="legal-links"><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></div>

<script>
(function () {
  const card = document.getElementById("card");
  const WEEKDAY_NAMES = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const MONTH_NAMES = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

  let me = null;
  let activeTab = "survey";
  let surveyMonth = null; // { year, month } - month ist 1-12
  let samplesDate = null; // "YYYY-MM-DD"
  let adminMonth = null; // { year, month }
  let settingsView = "root"; // "root" | "members" | "member" | "pharmacies" | "pharmacy"
  let selectedMemberID = null;
  let selectedPharmacyID = null;

  function render(html, appMode) {
    card.className = appMode ? "card app" : "card";
    card.innerHTML = html;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function todayDateString() {
    const now = new Date();
    return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
  }
  function formatDateString(dateString) {
    const [y, m, d] = dateString.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    return `${WEEKDAY_NAMES[date.getDay()]}, ${d}. ${MONTH_NAMES[m - 1]} ${y}`;
  }
  function addDaysToDateString(dateString, days) {
    const [y, m, d] = dateString.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() + days);
    return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
  }
  function monthRange(year, month) {
    const from = `${year}-${pad2(month)}-01`;
    const lastDay = new Date(year, month, 0).getDate();
    const to = `${year}-${pad2(month)}-${pad2(lastDay)}`;
    return { from, to };
  }

  function renderLogin(errorText) {
    render(
      '<h1>Probenfahrt</h1>' +
      '<p class="muted">Web-Zugang ohne Apple-Gerät</p>' +
      '<input type="password" id="passwordInput" placeholder="Passwort" autocomplete="current-password" />' +
      '<button class="primary" id="loginBtn">Anmelden</button>' +
      (errorText ? '<p class="error">' + escapeHtml(errorText) + '</p>' : '') +
      '<div class="brand">Probenfahrt</div>',
      false
    );
    const input = document.getElementById("passwordInput");
    const button = document.getElementById("loginBtn");
    const submit = function () { login(input.value); };
    button.addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    input.focus();
  }

  function renderShell(contentHtml) {
    render(
      '<div class="topbar">' +
        '<div><h2>' + escapeHtml(me.name) + '</h2><div class="who">' + escapeHtml(me.abbreviation) + (me.isAdmin ? " · Admin" : "") + '</div></div>' +
        '<button class="secondary icon" id="logoutBtn">Abmelden</button>' +
      '</div>' +
      '<div class="tabs">' +
        '<button class="tab' + (activeTab === "survey" ? " active" : "") + '" data-tab="survey">Umfragen</button>' +
        '<button class="tab' + (activeTab === "samples" ? " active" : "") + '" data-tab="samples">Proben</button>' +
        '<button class="tab' + (activeTab === "settings" ? " active" : "") + '" data-tab="settings">Einstellungen</button>' +
      '</div>' +
      '<div id="content">' + contentHtml + '</div>',
      true
    );
    document.getElementById("logoutBtn").addEventListener("click", logout);
    card.querySelectorAll(".tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.dataset.tab;
        if (activeTab === "survey") loadSurveyMonth(surveyMonth.year, surveyMonth.month);
        else if (activeTab === "samples") loadSamplesDay(samplesDate);
        else { settingsView = "root"; loadSettingsRoot(); }
      });
    });
  }

  async function loadSurveyMonth(year, month) {
    surveyMonth = { year, month };
    renderShell('<p class="muted">Lade…</p>');
    const { from, to } = monthRange(year, month);
    try {
      // mode=signup (nicht browse) - dieser Tab ist die Umfragen-Ansicht
      // (Ein-/Austragen), legt also wie SurveysView.swift fehlende
      // Mo-Do-Tage im gerade angezeigten Monat an.
      const response = await fetch("/api/survey-days?from=" + from + "&to=" + to + "&mode=signup");
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell('<p class="error">Konnte Umfragen nicht laden.</p>'); return; }
      const data = await response.json();
      renderShell(surveyMonthHtml(year, month, data));
      wireSurveyNav();
    } catch (e) {
      renderShell('<p class="error">Verbindung fehlgeschlagen.</p>');
    }
  }

  function surveyMonthHtml(year, month, data) {
    const entriesByDay = {};
    data.entries.forEach(function (entry) {
      (entriesByDay[entry.dayID] = entriesByDay[entry.dayID] || []).push(entry);
    });
    const days = data.days.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    const rows = days.length
      ? days.map(function (day) {
          const dayEntries = entriesByDay[day.id] || [];
          const names = dayEntries
            .map(function (e) { return escapeHtml(e.abbreviation || e.name || "?"); })
            .join(", ") || '<span class="muted">niemand eingetragen</span>';
          const lock = day.isLocked ? '<span class="lock">gesperrt' + (day.lockReason ? ": " + escapeHtml(day.lockReason) : "") + '</span>' : "";
          const iAmIn = dayEntries.some(function (e) { return e.userID === me.id; });
          const toggleBtn = day.isLocked
            ? ""
            : '<button class="secondary icon signup-toggle" data-day="' + escapeHtml(day.id) + '" data-signed-up="' + iAmIn + '">' + (iAmIn ? "Austragen" : "Eintragen") + '</button>';
          const lockBtn = me.isAdmin
            ? '<button class="secondary icon lock-toggle" data-day="' + escapeHtml(day.id) + '" data-locked="' + day.isLocked + '">' + (day.isLocked ? "Entsperren" : "Sperren") + '</button>'
            : "";
          return (
            '<div class="row"><div>' + escapeHtml(formatDateString(day.date)) + (lock ? " · " + lock : "") + '<br><span class="who">' + names + '</span></div>' +
            '<div>' + toggleBtn + " " + lockBtn + '</div></div>'
          );
        }).join("")
      : '<p class="muted">Für diesen Monat sind noch keine Umfrage-Tage angelegt.</p>';
    return (
      '<div class="nav">' +
        '<button class="secondary icon" id="prevMonthBtn">&larr;</button>' +
        '<strong>' + MONTH_NAMES[month - 1] + " " + year + '</strong>' +
        '<button class="secondary icon" id="nextMonthBtn">&rarr;</button>' +
      '</div>' +
      rows
    );
  }

  function wireSurveyNav() {
    document.getElementById("prevMonthBtn").addEventListener("click", function () {
      const m = surveyMonth.month === 1 ? 12 : surveyMonth.month - 1;
      const y = surveyMonth.month === 1 ? surveyMonth.year - 1 : surveyMonth.year;
      loadSurveyMonth(y, m);
    });
    document.getElementById("nextMonthBtn").addEventListener("click", function () {
      const m = surveyMonth.month === 12 ? 1 : surveyMonth.month + 1;
      const y = surveyMonth.month === 12 ? surveyMonth.year + 1 : surveyMonth.year;
      loadSurveyMonth(y, m);
    });
    card.querySelectorAll(".signup-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () { toggleSignup(btn.dataset.day, btn.dataset.signedUp === "true"); });
    });
    card.querySelectorAll(".lock-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () { toggleLock(btn.dataset.day, btn.dataset.locked === "true"); });
    });
  }

  async function toggleSignup(dayID, currentlySignedUp) {
    try {
      const response = await fetch("/api/survey-entries", {
        method: currentlySignedUp ? "DELETE" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dayID: dayID })
      });
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) {
        const data = await response.json().catch(function () { return {}; });
        alert(data.error || "Konnte nicht gespeichert werden.");
        return;
      }
      loadSurveyMonth(surveyMonth.year, surveyMonth.month);
    } catch (e) {
      alert("Verbindung fehlgeschlagen.");
    }
  }

  async function toggleLock(dayID, currentlyLocked) {
    let reason = "";
    if (!currentlyLocked) {
      reason = window.prompt("Grund für die Sperre (optional):", "") || "";
    }
    try {
      const response = await fetch("/api/survey-days/" + encodeURIComponent(dayID) + "/lock", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ locked: !currentlyLocked, reason: reason })
      });
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) {
        const data = await response.json().catch(function () { return {}; });
        alert(data.error || "Konnte nicht gespeichert werden.");
        return;
      }
      loadSurveyMonth(surveyMonth.year, surveyMonth.month);
    } catch (e) {
      alert("Verbindung fehlgeschlagen.");
    }
  }

  async function loadSamplesDay(dateString) {
    samplesDate = dateString;
    renderShell('<p class="muted">Lade…</p>');
    try {
      const response = await fetch("/api/samples?date=" + dateString);
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell('<p class="error">Konnte Proben-Status nicht laden.</p>'); return; }
      const data = await response.json();
      renderShell(samplesDayHtml(data));
      wireSamplesNav();
    } catch (e) {
      renderShell('<p class="error">Verbindung fehlgeschlagen.</p>');
    }
  }

  function samplesDayHtml(data) {
    const rows = data.items.length
      ? data.items.map(function (item) {
          const status = item.hasSamples ? '<span class="yes">Proben vorhanden</span>' : '<span class="no">Keine Proben</span>';
          return '<div class="row"><div>' + escapeHtml(item.name) + '</div><div>' + status + '</div></div>';
        }).join("")
      : '<p class="muted">Keine Meldungen an diesem Tag.</p>';
    return (
      '<div class="nav">' +
        '<button class="secondary icon" id="prevDayBtn">&larr;</button>' +
        '<strong>' + escapeHtml(formatDateString(data.date)) + '</strong>' +
        '<button class="secondary icon" id="nextDayBtn">&rarr;</button>' +
      '</div>' +
      (data.date !== todayDateString() ? '<button class="secondary" id="todayBtn">Heute</button>' : '') +
      rows
    );
  }

  function wireSamplesNav() {
    document.getElementById("prevDayBtn").addEventListener("click", function () { loadSamplesDay(addDaysToDateString(samplesDate, -1)); });
    document.getElementById("nextDayBtn").addEventListener("click", function () { loadSamplesDay(addDaysToDateString(samplesDate, 1)); });
    const todayBtn = document.getElementById("todayBtn");
    if (todayBtn) todayBtn.addEventListener("click", function () { loadSamplesDay(todayDateString()); });
  }

  // MARK: - Einstellungen (Profil + Admin: PDF-Export, Mitglieder, Apotheken)

  function loadSettingsRoot() {
    settingsView = "root";
    if (!adminMonth) {
      const now = new Date();
      adminMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
    }
    renderShell(settingsRootHtml());
    wireSettingsRoot();
  }

  function settingsRootHtml() {
    const abbreviationField = me.role === "admin"
      ? '<input type="text" id="profileAbbreviation" value="' + escapeHtml(me.abbreviation) + '" />'
      : '<p class="muted">' + escapeHtml(me.abbreviation) + ' (nur der Haupt-Admin kann das ändern)</p>';

    const adminSection = me.isAdmin ? (
      '<h3>Admin</h3>' +
      '<div class="nav">' +
        '<button class="secondary icon" id="prevAdminMonthBtn">&larr;</button>' +
        '<strong>' + MONTH_NAMES[adminMonth.month - 1] + " " + adminMonth.year + '</strong>' +
        '<button class="secondary icon" id="nextAdminMonthBtn">&rarr;</button>' +
      '</div>' +
      '<button class="primary" id="downloadTripsBtn">Fahrten-Auswertung (PDF)</button>' +
      '<button class="secondary" id="downloadSamplesBtn">Proben-Auswertung (PDF)</button>' +
      '<p class="error" id="adminError" style="display:none"></p>' +
      '<button class="secondary" id="openMembersBtn">Mitglieder verwalten</button>' +
      '<button class="secondary" id="openPharmaciesBtn">Apotheken verwalten</button>'
    ) : "";

    return (
      '<h3>Profil</h3>' +
      '<label class="field-label">Name</label>' +
      '<input type="text" id="profileName" value="' + escapeHtml(me.name) + '" />' +
      '<label class="field-label">Kürzel</label>' +
      abbreviationField +
      '<button class="primary" id="saveProfileBtn">Speichern</button>' +
      '<p class="error" id="profileError" style="display:none"></p>' +
      adminSection +
      '<button class="secondary" id="logoutBtn2">Abmelden</button>'
    );
  }

  function wireSettingsRoot() {
    document.getElementById("saveProfileBtn").addEventListener("click", saveProfile);
    document.getElementById("logoutBtn2").addEventListener("click", logout);
    if (!me.isAdmin) return;
    document.getElementById("prevAdminMonthBtn").addEventListener("click", function () {
      adminMonth = adminMonth.month === 1 ? { year: adminMonth.year - 1, month: 12 } : { year: adminMonth.year, month: adminMonth.month - 1 };
      loadSettingsRoot();
    });
    document.getElementById("nextAdminMonthBtn").addEventListener("click", function () {
      adminMonth = adminMonth.month === 12 ? { year: adminMonth.year + 1, month: 1 } : { year: adminMonth.year, month: adminMonth.month + 1 };
      loadSettingsRoot();
    });
    document.getElementById("downloadTripsBtn").addEventListener("click", function () {
      downloadReport(
        "/api/reports/monthly",
        "Fahrten-Auswertung " + MONTH_NAMES[adminMonth.month - 1] + " " + adminMonth.year,
        function (line) { return line.userName + ": " + line.tripCount + " " + (line.tripCount === 1 ? "Fahrt" : "Fahrten"); },
        "Keine Fahrten in diesem Monat.",
        "Fahrten-Auswertung-" + adminMonth.year + "-" + pad2(adminMonth.month) + ".pdf"
      );
    });
    document.getElementById("downloadSamplesBtn").addEventListener("click", function () {
      downloadReport(
        "/api/reports/samples",
        "Proben-Auswertung " + MONTH_NAMES[adminMonth.month - 1] + " " + adminMonth.year,
        function (line) { return line.locationName + ": " + line.daysWithSamples + " " + (line.daysWithSamples === 1 ? "Tag" : "Tage") + " mit Proben"; },
        "Keine Proben-Meldungen in diesem Monat.",
        "Proben-Auswertung-" + adminMonth.year + "-" + pad2(adminMonth.month) + ".pdf"
      );
    });
    document.getElementById("openMembersBtn").addEventListener("click", loadMembersList);
    document.getElementById("openPharmaciesBtn").addEventListener("click", loadPharmaciesList);
  }

  async function saveProfile() {
    const errorEl = document.getElementById("profileError");
    errorEl.style.display = "none";
    const name = document.getElementById("profileName").value.trim();
    const abbreviationInput = document.getElementById("profileAbbreviation");
    const abbreviation = abbreviationInput ? abbreviationInput.value.trim() : me.abbreviation;
    try {
      const response = await fetch("/api/profile", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, abbreviation: abbreviation })
      });
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) {
        const data = await response.json().catch(function () { return {}; });
        errorEl.textContent = data.error || "Konnte nicht gespeichert werden.";
        errorEl.style.display = "block";
        return;
      }
      const data = await response.json();
      me.name = data.name;
      me.abbreviation = data.abbreviation;
      loadSettingsRoot();
    } catch (e) {
      errorEl.textContent = "Verbindung fehlgeschlagen.";
      errorEl.style.display = "block";
    }
  }

  function backToSettingsHtml(innerHtml) {
    return '<button class="secondary icon" id="backToSettingsBtn">&larr; Einstellungen</button>' + innerHtml;
  }

  // MARK: - Mitglieder verwalten

  async function loadMembersList() {
    settingsView = "members";
    renderShell('<p class="muted">Lade…</p>');
    try {
      const response = await fetch("/api/members");
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell(backToSettingsHtml('<p class="error">Konnte Mitglieder nicht laden.</p>')); return; }
      const data = await response.json();
      renderShell(membersListHtml(data.members));
      wireMembersList();
    } catch (e) {
      renderShell(backToSettingsHtml('<p class="error">Verbindung fehlgeschlagen.</p>'));
    }
  }

  function membersListHtml(members) {
    const rows = members.length
      ? members.map(function (m) {
          const badge = m.role === "admin" ? " · Admin" : m.role === "viceAdmin" ? " · Vice-Admin" : "";
          return '<div class="row member-row" data-id="' + escapeHtml(m.id) + '"><div>' + escapeHtml(m.name) + badge + '</div><div class="who">' + escapeHtml(m.abbreviation) + '</div></div>';
        }).join("")
      : '<p class="muted">Keine Teammitglieder.</p>';
    return backToSettingsHtml('<h3>Mitglieder verwalten</h3>' + rows);
  }

  function wireMembersList() {
    document.getElementById("backToSettingsBtn").addEventListener("click", loadSettingsRoot);
    card.querySelectorAll(".member-row").forEach(function (row) {
      row.style.cursor = "pointer";
      row.addEventListener("click", function () { loadMemberDetail(row.dataset.id); });
    });
  }

  async function loadMemberDetail(memberID) {
    settingsView = "member";
    selectedMemberID = memberID;
    renderShell('<p class="muted">Lade…</p>');
    try {
      const [detailResponse, statsResponse] = await Promise.all([
        fetch("/api/members/" + encodeURIComponent(memberID)),
        fetch("/api/members/" + encodeURIComponent(memberID) + "/stats?period=week")
      ]);
      if (detailResponse.status === 401) { renderLogin(); return; }
      if (!detailResponse.ok) { renderShell(backToMembersHtml('<p class="error">Konnte Mitglied nicht laden.</p>')); return; }
      const detail = await detailResponse.json();
      const stats = statsResponse.ok ? await statsResponse.json() : { tripCount: 0 };
      renderShell(memberDetailHtml(detail, stats, "week"));
      wireMemberDetail(detail);
    } catch (e) {
      renderShell(backToMembersHtml('<p class="error">Verbindung fehlgeschlagen.</p>'));
    }
  }

  function backToMembersHtml(innerHtml) {
    return '<button class="secondary icon" id="backToMembersBtn">&larr; Mitglieder</button>' + innerHtml;
  }

  function memberDetailHtml(detail, stats, period) {
    const roleLabel = detail.role === "admin" ? "Haupt-Admin" : detail.role === "viceAdmin" ? "Vice-Admin" : "Mitglied";
    const passwordSection = detail.isFullAdminViewing ? (
      '<h3>Web-Zugang</h3>' +
      '<input type="text" id="memberPasswordInput" value="' + escapeHtml(detail.webPassword || "") + '" placeholder="Passwort (leer = kein Zugang)" />' +
      '<button class="secondary" id="saveMemberPasswordBtn">Passwort speichern</button>' +
      '<p class="error" id="memberPasswordError" style="display:none"></p>'
    ) : "";
    const roleToggle = (detail.isFullAdminViewing && detail.id !== me.id && detail.role !== "admin") ? (
      '<h3>Rolle</h3>' +
      '<label><input type="checkbox" id="viceAdminToggle" ' + (detail.role === "viceAdmin" ? "checked" : "") + ' /> Vice-Admin</label>'
    ) : "";
    const removeButton = (detail.isFullAdminViewing && detail.id !== me.id) ? (
      '<button class="secondary" id="removeMemberBtn" style="color:#ff3b30">Aus Gruppe entfernen</button>'
    ) : "";

    return backToMembersHtml(
      '<h2>' + escapeHtml(detail.name) + '</h2>' +
      '<p class="who">' + escapeHtml(detail.abbreviation) + ' · ' + roleLabel + '</p>' +
      '<p class="muted">Fahrten insgesamt: ' + detail.totalTrips + '</p>' +
      '<div class="nav">' +
        '<button class="secondary icon" id="periodWeekBtn">Woche</button>' +
        '<button class="secondary icon" id="periodMonthBtn">Monat</button>' +
      '</div>' +
      '<p id="periodTripCount">Fahrten diese Woche: ' + stats.tripCount + '</p>' +
      passwordSection +
      roleToggle +
      removeButton +
      '<p class="error" id="memberActionError" style="display:none"></p>'
    );
  }

  function wireMemberDetail(detail) {
    document.getElementById("backToMembersBtn").addEventListener("click", loadMembersList);
    document.getElementById("periodWeekBtn").addEventListener("click", function () { refreshMemberStats(detail.id, "week"); });
    document.getElementById("periodMonthBtn").addEventListener("click", function () { refreshMemberStats(detail.id, "month"); });

    const savePasswordBtn = document.getElementById("saveMemberPasswordBtn");
    if (savePasswordBtn) {
      savePasswordBtn.addEventListener("click", async function () {
        const errorEl = document.getElementById("memberPasswordError");
        errorEl.style.display = "none";
        const password = document.getElementById("memberPasswordInput").value.trim();
        try {
          const response = await fetch("/api/members/" + encodeURIComponent(detail.id) + "/web-password", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: password })
          });
          if (response.status === 401) { renderLogin(); return; }
          if (!response.ok) {
            const data = await response.json().catch(function () { return {}; });
            errorEl.textContent = data.error || "Konnte nicht gespeichert werden.";
            errorEl.style.display = "block";
          }
        } catch (e) {
          errorEl.textContent = "Verbindung fehlgeschlagen.";
          errorEl.style.display = "block";
        }
      });
    }

    const viceAdminToggle = document.getElementById("viceAdminToggle");
    if (viceAdminToggle) {
      viceAdminToggle.addEventListener("change", async function () {
        try {
          const response = await fetch("/api/members/" + encodeURIComponent(detail.id) + "/role", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ role: viceAdminToggle.checked ? "viceAdmin" : "member" })
          });
          if (response.status === 401) { renderLogin(); return; }
          if (!response.ok) {
            const data = await response.json().catch(function () { return {}; });
            alert(data.error || "Konnte nicht gespeichert werden.");
            viceAdminToggle.checked = !viceAdminToggle.checked;
          }
        } catch (e) {
          alert("Verbindung fehlgeschlagen.");
          viceAdminToggle.checked = !viceAdminToggle.checked;
        }
      });
    }

    const removeBtn = document.getElementById("removeMemberBtn");
    if (removeBtn) {
      removeBtn.addEventListener("click", async function () {
        if (!window.confirm(detail.name + " wirklich aus der Gruppe entfernen?")) return;
        try {
          const response = await fetch("/api/members/" + encodeURIComponent(detail.id), { method: "DELETE" });
          if (response.status === 401) { renderLogin(); return; }
          if (!response.ok) {
            const data = await response.json().catch(function () { return {}; });
            alert(data.error || "Konnte nicht entfernt werden.");
            return;
          }
          loadMembersList();
        } catch (e) {
          alert("Verbindung fehlgeschlagen.");
        }
      });
    }
  }

  async function refreshMemberStats(memberID, period) {
    try {
      const response = await fetch("/api/members/" + encodeURIComponent(memberID) + "/stats?period=" + period);
      if (!response.ok) return;
      const stats = await response.json();
      document.getElementById("periodTripCount").textContent = "Fahrten diese" + (period === "week" ? " Woche: " : "n Monat: ") + stats.tripCount;
    } catch (e) {}
  }

  // MARK: - Apotheken verwalten

  async function loadPharmaciesList() {
    settingsView = "pharmacies";
    renderShell('<p class="muted">Lade…</p>');
    try {
      const response = await fetch("/api/pharmacies");
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell(backToSettingsHtml('<p class="error">Konnte Apotheken nicht laden.</p>')); return; }
      const data = await response.json();
      renderShell(pharmaciesListHtml(data.pharmacies));
      wirePharmaciesList();
    } catch (e) {
      renderShell(backToSettingsHtml('<p class="error">Verbindung fehlgeschlagen.</p>'));
    }
  }

  function pharmaciesListHtml(pharmacies) {
    const rows = pharmacies.length
      ? pharmacies.map(function (p) {
          const status = p.hasSamples === true ? '<span class="yes">Proben</span>' : p.hasSamples === false ? '<span class="no">Keine Proben</span>' : '<span class="muted">Keine Meldung</span>';
          const qrLabel = p.usesQRCheckIn ? " · QR" : "";
          return '<div class="row pharmacy-row" data-id="' + escapeHtml(p.id) + '"><div>' + escapeHtml(p.name) + qrLabel + '</div><div>' + status + '</div></div>';
        }).join("")
      : '<p class="muted">Noch keine Apotheken angelegt.</p>';
    return backToSettingsHtml('<h3>Apotheken verwalten</h3><button class="primary" id="addPharmacyBtn">Neue Apotheke anlegen</button>' + rows);
  }

  function wirePharmaciesList() {
    document.getElementById("backToSettingsBtn").addEventListener("click", loadSettingsRoot);
    document.getElementById("addPharmacyBtn").addEventListener("click", function () {
      renderShell(addPharmacyFormHtml());
      wireAddPharmacyForm();
    });
    card.querySelectorAll(".pharmacy-row").forEach(function (row) {
      row.style.cursor = "pointer";
      row.addEventListener("click", function () { loadPharmacyDetail(row.dataset.id); });
    });
  }

  function addPharmacyFormHtml() {
    return (
      '<button class="secondary icon" id="cancelAddPharmacyBtn">&larr; Abbrechen</button>' +
      '<h3>Neue Apotheke</h3>' +
      '<input type="text" id="newPharmacyName" placeholder="Name der Apotheke" />' +
      '<input type="text" id="newPharmacyAddress" placeholder="Adresse (optional)" />' +
      '<label><input type="checkbox" id="newPharmacyQR" checked /> Web-Check-in per QR-Code</label>' +
      '<button class="primary" id="createPharmacyBtn">Anlegen</button>' +
      '<p class="error" id="addPharmacyError" style="display:none"></p>'
    );
  }

  function wireAddPharmacyForm() {
    document.getElementById("cancelAddPharmacyBtn").addEventListener("click", loadPharmaciesList);
    document.getElementById("createPharmacyBtn").addEventListener("click", async function () {
      const errorEl = document.getElementById("addPharmacyError");
      errorEl.style.display = "none";
      const name = document.getElementById("newPharmacyName").value.trim();
      const address = document.getElementById("newPharmacyAddress").value.trim();
      const usesQRCheckIn = document.getElementById("newPharmacyQR").checked;
      try {
        const response = await fetch("/api/pharmacies", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, address: address, usesQRCheckIn: usesQRCheckIn })
        });
        if (response.status === 401) { renderLogin(); return; }
        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          errorEl.textContent = data.error || "Konnte nicht angelegt werden.";
          errorEl.style.display = "block";
          return;
        }
        loadPharmaciesList();
      } catch (e) {
        errorEl.textContent = "Verbindung fehlgeschlagen.";
        errorEl.style.display = "block";
      }
    });
  }

  async function loadPharmacyDetail(pharmacyID) {
    settingsView = "pharmacy";
    selectedPharmacyID = pharmacyID;
    renderShell('<p class="muted">Lade…</p>');
    try {
      const response = await fetch("/api/pharmacies/" + encodeURIComponent(pharmacyID));
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell(backToPharmaciesHtml('<p class="error">Konnte Apotheke nicht laden.</p>')); return; }
      const detail = await response.json();
      renderShell(pharmacyDetailHtml(detail));
      wirePharmacyDetail(detail);
    } catch (e) {
      renderShell(backToPharmaciesHtml('<p class="error">Verbindung fehlgeschlagen.</p>'));
    }
  }

  function backToPharmaciesHtml(innerHtml) {
    return '<button class="secondary icon" id="backToPharmaciesBtn">&larr; Apotheken</button>' + innerHtml;
  }

  function pharmacyDetailHtml(detail) {
    const qrSection = detail.usesQRCheckIn ? (
      '<h3>Check-in-Link</h3>' +
      '<p class="who">' + escapeHtml(detail.checkInURL) + '</p>' +
      '<button class="secondary" id="copyLinkBtn">Link kopieren</button>'
    ) : '<p class="muted">Diese Apotheke meldet nicht per QR-Code - Status wird hier manuell gepflegt.</p>';

    return backToPharmaciesHtml(
      '<h2>' + escapeHtml(detail.name) + '</h2>' +
      (detail.address ? '<p class="who">' + escapeHtml(detail.address) + '</p>' : '') +
      qrSection +
      '<h3>Heute manuell melden</h3>' +
      '<button class="primary" id="reportYesBtn" ' + (detail.hasSamples === true ? "disabled" : "") + '>Ja, Proben vorhanden</button>' +
      '<button class="secondary" id="reportNoBtn" ' + (detail.hasSamples === false ? "disabled" : "") + '>Keine Proben</button>' +
      '<button class="secondary" id="deletePharmacyBtn" style="color:#ff3b30">Apotheke löschen</button>' +
      '<p class="error" id="pharmacyActionError" style="display:none"></p>'
    );
  }

  function wirePharmacyDetail(detail) {
    document.getElementById("backToPharmaciesBtn").addEventListener("click", loadPharmaciesList);
    const copyBtn = document.getElementById("copyLinkBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        navigator.clipboard.writeText(detail.checkInURL).then(function () {
          copyBtn.textContent = "Kopiert!";
          setTimeout(function () { copyBtn.textContent = "Link kopieren"; }, 1500);
        }).catch(function () {});
      });
    }
    document.getElementById("reportYesBtn").addEventListener("click", function () { submitPharmacyReport(detail.id, true); });
    document.getElementById("reportNoBtn").addEventListener("click", function () { submitPharmacyReport(detail.id, false); });
    document.getElementById("deletePharmacyBtn").addEventListener("click", async function () {
      if (!window.confirm(detail.name + " wirklich löschen? Alle Meldungen dieser Apotheke werden unwiderruflich gelöscht.")) return;
      try {
        const response = await fetch("/api/pharmacies/" + encodeURIComponent(detail.id), { method: "DELETE" });
        if (response.status === 401) { renderLogin(); return; }
        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          alert(data.error || "Konnte nicht gelöscht werden.");
          return;
        }
        loadPharmaciesList();
      } catch (e) {
        alert("Verbindung fehlgeschlagen.");
      }
    });
  }

  async function submitPharmacyReport(pharmacyID, hasSamples) {
    try {
      const response = await fetch("/api/pharmacies/" + encodeURIComponent(pharmacyID) + "/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hasSamples: hasSamples })
      });
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) {
        const data = await response.json().catch(function () { return {}; });
        alert(data.error || "Konnte nicht gespeichert werden.");
        return;
      }
      loadPharmacyDetail(pharmacyID);
    } catch (e) {
      alert("Verbindung fehlgeschlagen.");
    }
  }

  async function downloadReport(endpoint, title, formatLine, emptyMessage, filename) {
    const errorEl = document.getElementById("adminError");
    errorEl.style.display = "none";
    try {
      const response = await fetch(endpoint + "?year=" + adminMonth.year + "&month=" + adminMonth.month);
      if (response.status === 401) { renderLogin(); return; }
      if (response.status === 403) { errorEl.textContent = "Nur für Admins."; errorEl.style.display = "block"; return; }
      if (!response.ok) { errorEl.textContent = "Konnte Auswertung nicht laden."; errorEl.style.display = "block"; return; }
      const data = await response.json();
      const bytes = buildSimplePdfBytes(title, data.lines.map(formatLine), emptyMessage);
      const blob = new Blob([bytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    } catch (e) {
      errorEl.textContent = "Verbindung fehlgeschlagen.";
      errorEl.style.display = "block";
    }
  }

  /**
   * Handgeschriebener, minimaler PDF-Writer statt einer vendorten Bibliothek
   * (pdf-lib o.ä. wäre für "Titel + Zeilenliste auf einer A4-Seite" ein
   * unverhältnismäßig großer, ungeprüfter Blob) - erzeugt eine einzelne
   * A4-Seite mit Helvetica/WinAnsiEncoding, gegen echtes pdftotext verifiziert.
   * Layout absichtlich analog PDFReportRenderer.swift (Titel fett 20pt oben,
   * Zeilen 14pt ab y=90, Schrittweite 24pt) - keine Paginierung, das native
   * Original paginiert auch nicht.
   */
  function pdfEscapeText(text) {
    return String(text).replace(/[\\()]/g, function (c) { return "\\" + c; });
  }

  function latin1BytesFromString(str) {
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      bytes[i] = code <= 255 ? code : 0x3f; // "?" für nicht darstellbare Zeichen
    }
    return bytes;
  }

  function buildSimplePdfBytes(title, lines, emptyMessage) {
    const pageWidth = 595.2;
    const pageHeight = 841.8; // A4 bei 72dpi, wie PDFReportRenderer.swift

    let content = "";
    content += "BT\n/F2 20 Tf\n1 0 0 1 40 " + (pageHeight - 40 - 16).toFixed(1) + " Tm\n(" + pdfEscapeText(title) + ") Tj\nET\n";
    let y = pageHeight - 90 - 11.2;
    const bodyLines = lines.length ? lines : [emptyMessage];
    bodyLines.forEach(function (line) {
      content += "BT\n/F1 14 Tf\n1 0 0 1 40 " + y.toFixed(1) + " Tm\n(" + pdfEscapeText(line) + ") Tj\nET\n";
      y -= 24;
    });

    const objects = [
      "<< /Type /Catalog /Pages 2 0 R >>",
      "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pageWidth.toFixed(1) + " " + pageHeight.toFixed(1) + "] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
      "<< /Length " + content.length + " >>\nstream\n" + content + "endstream",
    ];

    let out = "%PDF-1.4\n";
    const offsets = [0];
    objects.forEach(function (body, i) {
      offsets[i + 1] = out.length;
      out += (i + 1) + " 0 obj\n" + body + "\nendobj\n";
    });

    const xrefOffset = out.length;
    out += "xref\n0 " + (objects.length + 1) + "\n";
    out += "0000000000 65535 f \n";
    for (let i = 1; i <= objects.length; i++) {
      out += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
    }
    out += "trailer\n<< /Size " + (objects.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xrefOffset + "\n%%EOF";

    return latin1BytesFromString(out);
  }

  async function login(password) {
    if (!password) { renderLogin("Bitte Passwort eingeben."); return; }
    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password })
      });
      if (response.status === 401) {
        renderLogin("Falsches Passwort.");
        return;
      }
      if (!response.ok) {
        renderLogin("Verbindung fehlgeschlagen. Bitte erneut versuchen.");
        return;
      }
      await checkSession();
    } catch (e) {
      renderLogin("Verbindung fehlgeschlagen. Bitte erneut versuchen.");
    }
  }

  async function logout() {
    try {
      await fetch("/api/logout", { method: "POST" });
    } catch (e) {
      // Cookie ablaufen lassen reicht notfalls auch - Login-Screen zeigen
      // wir trotzdem, damit niemand auf einem fremden Gerät angemeldet bleibt.
    }
    me = null;
    renderLogin();
  }

  async function checkSession() {
    try {
      const response = await fetch("/api/me");
      if (response.status === 401) {
        renderLogin();
        return;
      }
      if (!response.ok) {
        render('<h1>Probenfahrt</h1><p class="error">Verbindung fehlgeschlagen. Bitte Seite neu laden.</p>', false);
        return;
      }
      me = await response.json();
      const now = new Date();
      surveyMonth = { year: now.getFullYear(), month: now.getMonth() + 1 };
      samplesDate = todayDateString();
      activeTab = "survey";
      loadSurveyMonth(surveyMonth.year, surveyMonth.month);
    } catch (e) {
      render('<h1>Probenfahrt</h1><p class="error">Verbindung fehlgeschlagen. Bitte Internetverbindung prüfen und die Seite neu laden.</p>', false);
    }
  }

  checkSession();
})();
</script>
