<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Probenfahrt · Web-App</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f2f7;
    color: #1c1c1e;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f2f2f7; }
    .card { background: #1c1c1e; }
    .muted { color: #8e8e93; }
    button.secondary, button.tab, button.cal-mode-btn { background: #2c2c2e; color: #f2f2f7; border-color: #3a3a3c; }
    button.tab.active, button.cal-mode-btn.active { background: #34c759; color: #fff; }
    input[type="password"], input[type="text"] { background: #1c1c1e; color: #f2f2f7; border-color: #3a3a3c; }
    .row { border-color: #3a3a3c; }
  }
  .card {
    width: 100%;
    max-width: 420px;
    margin-top: 40px;
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center;
  }
  .card.app { max-width: 640px; text-align: left; margin-top: 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0; }
  .muted { color: #6e6e73; font-size: 0.95rem; margin: 0 0 24px; }
  .card.app .muted { margin: 0; }
  button {
    padding: 14px 16px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card:not(.app) button { display: block; width: 100%; margin-bottom: 12px; }
  button.primary { background: #34c759; color: #fff; }
  button.secondary { background: #f2f2f7; color: #1c1c1e; border: 1px solid #d1d1d6; }
  button.icon { padding: 8px 14px; }
  input[type="password"], input[type="text"] {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    border-radius: 14px;
    border: 1px solid #d1d1d6;
    margin-bottom: 12px;
    box-sizing: border-box;
  }
  .field-label { display: block; font-size: 0.8rem; color: #6e6e73; margin-bottom: 4px; }
  label:has(input[type="checkbox"]) { display: block; margin-bottom: 12px; }
  h3 { font-size: 1rem; margin: 20px 0 8px; }
  h3:first-child { margin-top: 0; }
  .error { color: #ff3b30; font-size: 0.95rem; }
  .brand { font-size: 0.75rem; color: #a1a1a6; margin-top: 28px; text-align: center; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  button.tab { flex: 1; background: #f2f2f7; color: #1c1c1e; border: 1px solid #d1d1d6; }
  button.tab.active { background: #34c759; color: #fff; border-color: #34c759; }
  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid #e5e5ea;
  }
  .row:last-child { border-bottom: none; }
  .row .who { font-size: 0.9rem; color: #6e6e73; }
  .lock { color: #ff9500; font-size: 0.85rem; }
  .yes { color: #34c759; }
  .no { color: #6e6e73; }
  .warn { color: #ff3b30; }
  .survey-covered { background: rgba(52,199,89,0.12); border-radius: 8px; padding-left: 6px; padding-right: 6px; }
  .current-badge { background: #34c759; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
  button.cal-mode-btn { flex: 1; background: #f2f2f7; color: #1c1c1e; border: 1px solid #d1d1d6; }
  button.cal-mode-btn.active { background: #34c759; color: #fff; border-color: #34c759; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px; }
  .cal-head { text-align: center; font-size: 0.75rem; color: #6e6e73; padding: 4px 0; }
  .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.8rem; }
  .cal-outside { opacity: 0.35; }
  .cal-today { background: rgba(255,204,0,0.22); }
  .cal-daynum { font-weight: 600; }
  .cal-initials { font-size: 0.6rem; color: #6e6e73; }
  .cal-lock { font-size: 0.7rem; }
  .legal-links { text-align: center; margin-top: 56px; padding-top: 16px; font-size: 0.75rem; }
  .legal-links a { color: #a1a1a6; text-decoration: none; }
  .legal-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="muted" id="loading">Lade…</div>
  </div>
  <div class="legal-links"><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></div>

<script>
(function () {
  const card = document.getElementById("card");
  const WEEKDAY_NAMES = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const MONTH_NAMES = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

  let me = null;
  let activeTab = "survey";
  let surveyReferenceDate = null; // "YYYY-MM-DD" - Basis fürs 2-Wochen-Fenster
  let surveyView = "current"; // "current" | "past"
  let calendarViewMode = "month"; // "month" | "week"
  let calendarReferenceDate = null; // "YYYY-MM-DD" (im Monatsmodus immer Tag 1)
  let samplesDate = null; // "YYYY-MM-DD"
  let adminMonth = null; // { year, month }
  let settingsView = "root"; // "root" | "members" | "member" | "pharmacies" | "pharmacy"
  let selectedMemberID = null;
  let selectedPharmacyID = null;

  function render(html, appMode) {
    card.className = appMode ? "card app" : "card";
    card.innerHTML = html;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function todayDateString() {
    const now = new Date();
    return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
  }
  function formatDateString(dateString) {
    const [y, m, d] = dateString.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    return `${WEEKDAY_NAMES[date.getDay()]}, ${d}. ${MONTH_NAMES[m - 1]} ${y}`;
  }
  function addDaysToDateString(dateString, days) {
    const [y, m, d] = dateString.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() + days);
    return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
  }
  function monthRange(year, month) {
    const from = `${year}-${pad2(month)}-01`;
    const lastDay = new Date(year, month, 0).getDate();
    const to = `${year}-${pad2(month)}-${pad2(lastDay)}`;
    return { from, to };
  }

  function renderLogin(errorText) {
    render(
      '<h1>Probenfahrt</h1>' +
      '<p class="muted">Web-Zugang ohne Apple-Gerät</p>' +
      '<input type="password" id="passwordInput" placeholder="Passwort" autocomplete="current-password" />' +
      '<button class="primary" id="loginBtn">Anmelden</button>' +
      (errorText ? '<p class="error">' + escapeHtml(errorText) + '</p>' : '') +
      '<div class="brand">Probenfahrt</div>',
      false
    );
    const input = document.getElementById("passwordInput");
    const button = document.getElementById("loginBtn");
    const submit = function () { login(input.value); };
    button.addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    input.focus();
  }

  function renderShell(contentHtml) {
    render(
      '<div class="topbar">' +
        '<div><h2>' + escapeHtml(me.name) + '</h2><div class="who">' + escapeHtml(me.abbreviation) + (me.isAdmin ? " · Admin" : "") + '</div></div>' +
        '<button class="secondary icon" id="logoutBtn">Abmelden</button>' +
      '</div>' +
      '<div class="tabs">' +
        '<button class="tab' + (activeTab === "survey" ? " active" : "") + '" data-tab="survey">Umfragen</button>' +
        '<button class="tab' + (activeTab === "calendar" ? " active" : "") + '" data-tab="calendar">Kalender</button>' +
        '<button class="tab' + (activeTab === "samples" ? " active" : "") + '" data-tab="samples">Proben</button>' +
        '<button class="tab' + (activeTab === "settings" ? " active" : "") + '" data-tab="settings">Einstellungen</button>' +
      '</div>' +
      '<div id="content">' + contentHtml + '</div>',
      true
    );
    document.getElementById("logoutBtn").addEventListener("click", logout);
    card.querySelectorAll(".tab").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.dataset.tab;
        if (activeTab === "survey") loadCurrentSurveys();
        else if (activeTab === "calendar") loadCalendarTab();
        else if (activeTab === "samples") loadSamplesDay(samplesDate);
        else { settingsView = "root"; loadSettingsRoot(); }
      });
    });
  }

  // MARK: - Umfragen (rollierendes 2-Wochen-Fenster, JS-Port von
  // SurveyWeekWindow.swift - Freitag/Samstag/Sonntag springt auf nächste
  // Woche Montag, sonst diese Woche)

  function weekdayOf(dateString) {
    const [y, m, d] = dateString.split("-").map(Number);
    return new Date(y, m - 1, d).getDay(); // 0=So...6=Sa
  }

  function mondayStartOfWeekDateString(dateString) {
    const daysSinceMonday = (weekdayOf(dateString) + 6) % 7; // Mo->0
    return addDaysToDateString(dateString, -daysSinceMonday);
  }

  function currentAnchorMondayDateString(dateString) {
    const thisMonday = mondayStartOfWeekDateString(dateString);
    const weekday = weekdayOf(dateString);
    const isPastThisWeeksSurveyDays = weekday === 0 || weekday >= 5; // So, Fr, Sa
    return isPastThisWeeksSurveyDays ? addDaysToDateString(thisMonday, 7) : thisMonday;
  }

  function weekBlockFrom(weekStart) {
    const days = [0, 1, 2, 3].map(function (i) { return addDaysToDateString(weekStart, i); });
    return { weekStart: weekStart, weekEnd: days[3], days: days };
  }

  function currentWeekBlocks(dateString) {
    const anchor = currentAnchorMondayDateString(dateString);
    return [0, 1].map(function (weekOffset) { return weekBlockFrom(addDaysToDateString(anchor, weekOffset * 7)); });
  }

  function pastWeekBlocks(dateString, weeksBack) {
    const anchor = currentAnchorMondayDateString(dateString);
    const blocks = [];
    for (let weeksAgo = 1; weeksAgo <= weeksBack; weeksAgo++) {
      blocks.push(weekBlockFrom(addDaysToDateString(anchor, -7 * weeksAgo)));
    }
    return blocks; // most-recent-first
  }

  function formatShortDate(dateString) {
    const [y, m, d] = dateString.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    return WEEKDAY_NAMES[date.getDay()] + ", " + d + ". " + MONTH_NAMES[m - 1];
  }

  function canEditDayClientSide(dateString) {
    return me.isAdmin || dateString >= todayDateString();
  }

  async function loadCurrentSurveys() {
    activeTab = "survey";
    surveyView = "current";
    renderShell('<p class="muted">Lade…</p>');
    const blocks = currentWeekBlocks(surveyReferenceDate);
    const from = blocks[0].days[0];
    const to = blocks[1].days[3];
    try {
      // mode=signup (nicht browse) - dieser Tab ist die Umfragen-Ansicht
      // (Ein-/Austragen), legt also wie SurveysView.swift fehlende
      // Mo-Do-Tage im 2-Wochen-Fenster an.
      const response = await fetch("/api/survey-days?from=" + from + "&to=" + to + "&mode=signup");
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell('<p class="error">Konnte Umfragen nicht laden.</p>'); return; }
      const data = await response.json();
      renderShell(surveyBlocksHtml(blocks, data, true));
      wireSurveyBlocks(data, loadCurrentSurveys);
      document.getElementById("pastSurveysBtn").addEventListener("click", loadPastSurveys);
    } catch (e) {
      renderShell('<p class="error">Verbindung fehlgeschlagen.</p>');
    }
  }

  async function loadPastSurveys() {
    activeTab = "survey";
    surveyView = "past";
    renderShell('<p class="muted">Lade…</p>');
    const blocks = pastWeekBlocks(surveyReferenceDate, 8); // most-recent-first
    const from = blocks[blocks.length - 1].days[0];
    const to = blocks[0].days[3];
    try {
      // mode=browse (nicht signup) - vergangene Wochen rein lesend
      // durchblättern legt keine leeren Tage an.
      const response = await fetch("/api/survey-days?from=" + from + "&to=" + to + "&mode=browse");
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell('<p class="error">Konnte vergangene Umfragen nicht laden.</p>'); return; }
      const data = await response.json();
      renderShell(surveyBlocksHtml(blocks, data, false));
      wireSurveyBlocks(data, loadPastSurveys);
      document.getElementById("backToCurrentSurveysBtn").addEventListener("click", loadCurrentSurveys);
    } catch (e) {
      renderShell('<p class="error">Verbindung fehlgeschlagen.</p>');
    }
  }

  function surveyBlocksHtml(blocks, data, isCurrent) {
    const entriesByDay = {};
    data.entries.forEach(function (entry) {
      (entriesByDay[entry.dayID] = entriesByDay[entry.dayID] || []).push(entry);
    });
    const dayByDate = {};
    data.days.forEach(function (day) { dayByDate[day.date] = day; });

    const blocksHtml = blocks.map(function (block, index) {
      const badge = (isCurrent && index === 0) ? ' <span class="current-badge">Aktuell</span>' : "";
      const header = '<h3>Fahrplan vom ' + formatShortDate(block.days[0]) + ' bis ' + formatShortDate(block.days[3]) + badge + '</h3>';
      const rows = block.days.map(function (dateString) {
        const day = dayByDate[dateString];
        if (!day) return '<div class="row"><div>' + formatShortDate(dateString) + '</div><div class="muted">nicht angelegt</div></div>';
        return surveyDayRowHtml(day, entriesByDay[day.id] || []);
      }).join("");
      return header + rows;
    }).join("");

    return isCurrent
      ? (blocksHtml + '<button class="secondary" id="pastSurveysBtn">Vergangene Umfragen</button>')
      : ('<button class="secondary icon" id="backToCurrentSurveysBtn">&larr; Zurück zu Aktuell</button>' + blocksHtml);
  }

  function surveyDayRowHtml(day, entries) {
    const count = entries.length;
    const marker = count > 1 ? ' <span class="warn">!</span>' : (count === 1 ? ' <span class="yes">&#10003;</span>' : "");
    const rowClass = count === 1 ? "row survey-covered" : "row";
    const names = entries.map(function (e) { return escapeHtml(e.abbreviation || e.name || "?"); }).join(", ") || '<span class="muted">niemand eingetragen</span>';
    const bodyLine = day.isLocked
      ? '<span class="lock">gesperrt' + (day.lockReason ? ": " + escapeHtml(day.lockReason) : "") + '</span>'
      : names;

    const iAmIn = entries.some(function (e) { return e.userID === me.id; });
    const canEdit = canEditDayClientSide(day.date);
    let actionBtn = "";
    if (!day.isLocked) {
      if (canEdit) {
        actionBtn = '<button class="secondary icon signup-toggle" data-day="' + escapeHtml(day.id) + '" data-signed-up="' + iAmIn + '">' + (iAmIn ? "Austragen" : "Eintragen") + '</button>';
      } else if (me.isAdmin) {
        actionBtn = '<button class="secondary icon manage-day" data-day="' + escapeHtml(day.id) + '">Verwalten</button>';
      }
    }
    const lockBtn = me.isAdmin
      ? '<button class="secondary icon lock-toggle" data-day="' + escapeHtml(day.id) + '" data-locked="' + day.isLocked + '">' + (day.isLocked ? "Entsperren" : "Sperren") + '</button>'
      : "";

    return (
      '<div class="' + rowClass + '"><div>' + formatShortDate(day.date) + marker + '<br><span class="who">' + bodyLine + '</span></div>' +
      '<div>' + actionBtn + ' ' + lockBtn + '</div></div>'
    );
  }

  function wireSurveyBlocks(data, reloadFn) {
    card.querySelectorAll(".signup-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () { toggleSignup(btn.dataset.day, btn.dataset.signedUp === "true", null, reloadFn); });
    });
    card.querySelectorAll(".lock-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () { toggleLock(btn.dataset.day, btn.dataset.locked === "true", reloadFn); });
    });
    card.querySelectorAll(".manage-day").forEach(function (btn) {
      btn.addEventListener("click", function () { openManageDay(btn.dataset.day, data, reloadFn); });
    });
  }

  function openManageDay(dayID, data, reloadFn) {
    const day = data.days.find(function (d) { return d.id === dayID; });
    const entries = data.entries.filter(function (e) { return e.dayID === dayID; });
    renderShell(manageDayHtml(day, entries, data.members));
    wireManageDay(day, reloadFn);
  }

  function manageDayHtml(day, entries, members) {
    const entriesByUserID = {};
    entries.forEach(function (e) { entriesByUserID[e.userID] = true; });
    const rows = members.length
      ? members.map(function (m) {
          const isIn = !!entriesByUserID[m.id];
          return (
            '<div class="row"><div>' + escapeHtml(m.name) + '</div><div>' +
            '<button class="secondary icon manage-toggle" data-user="' + escapeHtml(m.id) + '" data-signed-up="' + isIn + '">' + (isIn ? "Austragen" : "Eintragen") + '</button>' +
            '</div></div>'
          );
        }).join("")
      : '<p class="muted">Keine Mitglieder.</p>';
    return (
      '<button class="secondary icon" id="backFromManageBtn">&larr; Zurück</button>' +
      '<h3>' + formatShortDate(day.date) + ' verwalten</h3>' +
      rows
    );
  }

  function wireManageDay(day, reloadFn) {
    document.getElementById("backFromManageBtn").addEventListener("click", reloadFn);
    card.querySelectorAll(".manage-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        toggleSignup(day.id, btn.dataset.signedUp === "true", btn.dataset.user, reloadFn);
      });
    });
  }

  async function toggleSignup(dayID, currentlySignedUp, userID, reloadFn) {
    try {
      const body = userID ? { dayID: dayID, userID: userID } : { dayID: dayID };
      const response = await fetch("/api/survey-entries", {
        method: currentlySignedUp ? "DELETE" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) {
        const data = await response.json().catch(function () { return {}; });
        alert(data.error || "Konnte nicht gespeichert werden.");
        return;
      }
      reloadFn();
    } catch (e) {
      alert("Verbindung fehlgeschlagen.");
    }
  }

  async function toggleLock(dayID, currentlyLocked, reloadFn) {
    let reason = "";
    if (!currentlyLocked) {
      reason = window.prompt("Grund für die Sperre (optional):", "") || "";
    }
    try {
      const response = await fetch("/api/survey-days/" + encodeURIComponent(dayID) + "/lock", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ locked: !currentlyLocked, reason: reason })
      });
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) {
        const data = await response.json().catch(function () { return {}; });
        alert(data.error || "Konnte nicht gespeichert werden.");
        return;
      }
      reloadFn();
    } catch (e) {
      alert("Verbindung fehlgeschlagen.");
    }
  }

  // MARK: - Kalender (rein lesend, Monat-/Wochen-Grid, JS-Port von
  // CalendarView.swift/MonthGridView.swift/WeekListView.swift - im
  // Gegensatz zu Umfragen ohne jede Klick-Interaktion)

  function isoWeekNumber(dateString) {
    const [y, m, d] = dateString.split("-").map(Number);
    const date = new Date(Date.UTC(y, m - 1, d));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
    firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
    return 1 + Math.round((date - firstThursday) / (7 * 24 * 60 * 60 * 1000));
  }

  function shiftMonthDateString(dateString, delta) {
    const [y, m] = dateString.split("-").map(Number);
    let newMonth = m + delta;
    let newYear = y;
    while (newMonth > 12) { newMonth -= 12; newYear++; }
    while (newMonth < 1) { newMonth += 12; newYear--; }
    return `${newYear}-${pad2(newMonth)}-01`;
  }

  function monthGridWeeks(year, month) {
    const firstOfMonth = `${year}-${pad2(month)}-01`;
    const leadingOffset = (weekdayOf(firstOfMonth) + 6) % 7; // Mo->0
    const gridStart = addDaysToDateString(firstOfMonth, -leadingOffset);

    const lastDayNum = new Date(year, month, 0).getDate();
    const lastOfMonth = `${year}-${pad2(month)}-${pad2(lastDayNum)}`;
    const trailingOffset = 6 - ((weekdayOf(lastOfMonth) + 6) % 7);
    const gridEnd = addDaysToDateString(lastOfMonth, trailingOffset);

    const weeks = [];
    let cursor = gridStart;
    while (cursor <= gridEnd) {
      const week = [];
      for (let i = 0; i < 7; i++) { week.push(cursor); cursor = addDaysToDateString(cursor, 1); }
      weeks.push(week);
    }
    return weeks;
  }

  async function loadCalendarTab() {
    activeTab = "calendar";
    renderShell('<p class="muted">Lade…</p>');
    const [y, m] = calendarReferenceDate.split("-").map(Number);
    let from, to, navLabel;
    if (calendarViewMode === "month") {
      const range = monthRange(y, m);
      from = range.from; to = range.to;
      navLabel = MONTH_NAMES[m - 1] + " " + y;
    } else {
      const weekStart = mondayStartOfWeekDateString(calendarReferenceDate);
      from = weekStart;
      to = addDaysToDateString(weekStart, 3);
      navLabel = "KW " + isoWeekNumber(calendarReferenceDate);
    }
    try {
      // mode=browse - der Kalender-Tab legt nie Tage an, reines Durchblättern
      // (auch in die Zukunft) darf keine Seiteneffekte haben.
      const response = await fetch("/api/survey-days?from=" + from + "&to=" + to + "&mode=browse");
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell('<p class="error">Konnte Kalender nicht laden.</p>'); return; }
      const data = await response.json();
      const body = calendarViewMode === "month" ? calendarMonthGridHtml(y, m, data) : calendarWeekListHtml(data, from);
      renderShell(calendarShellHtml(navLabel, body));
      wireCalendarNav();
    } catch (e) {
      renderShell('<p class="error">Verbindung fehlgeschlagen.</p>');
    }
  }

  function calendarShellHtml(navLabel, bodyHtml) {
    return (
      '<div class="tabs">' +
        '<button class="cal-mode-btn' + (calendarViewMode === "month" ? " active" : "") + '" id="calModeMonthBtn">Monat</button>' +
        '<button class="cal-mode-btn' + (calendarViewMode === "week" ? " active" : "") + '" id="calModeWeekBtn">Woche</button>' +
      '</div>' +
      '<div class="nav">' +
        '<button class="secondary icon" id="prevCalBtn">&larr;</button>' +
        '<strong>' + navLabel + '</strong>' +
        '<button class="secondary icon" id="nextCalBtn">&rarr;</button>' +
      '</div>' +
      bodyHtml
    );
  }

  function calendarMonthGridHtml(year, month, data) {
    const dayByDate = {};
    data.days.forEach(function (day) { dayByDate[day.date] = day; });
    const entriesByDay = {};
    data.entries.forEach(function (entry) { (entriesByDay[entry.dayID] = entriesByDay[entry.dayID] || []).push(entry); });

    const today = todayDateString();
    const weeks = monthGridWeeks(year, month);
    const head = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(function (w) { return '<div class="cal-head">' + w + '</div>'; }).join("");
    const cells = weeks.map(function (week) {
      return week.map(function (dateString) {
        const [, cellMonth, cellDay] = dateString.split("-").map(Number);
        const inMonth = cellMonth === month;
        const weekdayIdx = weekdayOf(dateString); // 0=So...6=Sa
        const isSurveyDay = weekdayIdx >= 1 && weekdayIdx <= 4; // Mo-Do
        let content = "";
        if (isSurveyDay && inMonth) {
          const day = dayByDate[dateString];
          if (day) {
            if (day.isLocked) {
              content = '<div class="cal-lock">&#128274;</div>';
            } else {
              const entries = (entriesByDay[day.id] || []).slice(0, 2);
              const initials = entries.map(function (e) { return escapeHtml(e.abbreviation || "?"); }).join(",");
              content = initials ? '<div class="cal-initials">' + initials + '</div>' : "";
            }
          }
        }
        const classes = "cal-cell" + (inMonth ? "" : " cal-outside") + (dateString === today ? " cal-today" : "");
        return '<div class="' + classes + '"><div class="cal-daynum">' + cellDay + '</div>' + content + '</div>';
      }).join("");
    }).join("");

    return '<div class="cal-grid">' + head + cells + '</div>';
  }

  function calendarWeekListHtml(data, weekStart) {
    const dayByDate = {};
    data.days.forEach(function (day) { dayByDate[day.date] = day; });
    const entriesByDay = {};
    data.entries.forEach(function (entry) { (entriesByDay[entry.dayID] = entriesByDay[entry.dayID] || []).push(entry); });

    const days = [0, 1, 2, 3].map(function (i) { return addDaysToDateString(weekStart, i); });
    return days.map(function (dateString) {
      const day = dayByDate[dateString];
      let body;
      if (!day) {
        body = '<span class="muted">nicht angelegt</span>';
      } else if (day.isLocked) {
        body = '<span class="lock">gesperrt' + (day.lockReason ? ": " + escapeHtml(day.lockReason) : "") + '</span>';
      } else {
        const entries = (entriesByDay[day.id] || []).slice().sort(function (a, b) { return (a.name || "").localeCompare(b.name || "", "de"); });
        body = entries.length
          ? entries.map(function (e) { return escapeHtml(e.name || e.abbreviation || "?"); }).join(", ")
          : '<span class="muted">niemand eingetragen</span>';
      }
      return '<div class="row"><div>' + formatShortDate(dateString) + '</div><div class="who">' + body + '</div></div>';
    }).join("");
  }

      '<input type="text" id="newPharmacyAddress" placeholder="Adresse (optional)" />' +
      '<label><input type="checkbox" id="newPharmacyQR" checked /> Web-Check-in per QR-Code</label>' +
      '<button class="primary" id="createPharmacyBtn">Anlegen</button>' +
      '<p class="error" id="addPharmacyError" style="display:none"></p>'
    );
  }

  function wireAddPharmacyForm() {
    document.getElementById("cancelAddPharmacyBtn").addEventListener("click", loadPharmaciesList);
    document.getElementById("createPharmacyBtn").addEventListener("click", async function () {
      const errorEl = document.getElementById("addPharmacyError");
      errorEl.style.display = "none";
      const name = document.getElementById("newPharmacyName").value.trim();
      const address = document.getElementById("newPharmacyAddress").value.trim();
      const usesQRCheckIn = document.getElementById("newPharmacyQR").checked;
      try {
        const response = await fetch("/api/pharmacies", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, address: address, usesQRCheckIn: usesQRCheckIn })
        });
        if (response.status === 401) { renderLogin(); return; }
        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          errorEl.textContent = data.error || "Konnte nicht angelegt werden.";
          errorEl.style.display = "block";
          return;
        }
        loadPharmaciesList();
      } catch (e) {
        errorEl.textContent = "Verbindung fehlgeschlagen.";
        errorEl.style.display = "block";
      }
    });
  }

  async function loadPharmacyDetail(pharmacyID) {
    settingsView = "pharmacy";
    selectedPharmacyID = pharmacyID;
    renderShell('<p class="muted">Lade…</p>');
    try {
      const response = await fetch("/api/pharmacies/" + encodeURIComponent(pharmacyID));
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) { renderShell(backToPharmaciesHtml('<p class="error">Konnte Apotheke nicht laden.</p>')); return; }
      const detail = await response.json();
      renderShell(pharmacyDetailHtml(detail));
      wirePharmacyDetail(detail);
    } catch (e) {
      renderShell(backToPharmaciesHtml('<p class="error">Verbindung fehlgeschlagen.</p>'));
    }
  }

  function backToPharmaciesHtml(innerHtml) {
    return '<button class="secondary icon" id="backToPharmaciesBtn">&larr; Apotheken</button>' + innerHtml;
  }

  function pharmacyDetailHtml(detail) {
    const qrSection = detail.usesQRCheckIn ? (
      '<h3>Check-in-Link</h3>' +
      '<p class="who">' + escapeHtml(detail.checkInURL) + '</p>' +
      '<button class="secondary" id="copyLinkBtn">Link kopieren</button>'
    ) : '<p class="muted">Diese Apotheke meldet nicht per QR-Code - Status wird hier manuell gepflegt.</p>';

    return backToPharmaciesHtml(
      '<h2>' + escapeHtml(detail.name) + '</h2>' +
      (detail.address ? '<p class="who">' + escapeHtml(detail.address) + '</p>' : '') +
      qrSection +
      '<h3>Heute manuell melden</h3>' +
      '<button class="primary" id="reportYesBtn" ' + (detail.hasSamples === true ? "disabled" : "") + '>Ja, Proben vorhanden</button>' +
      '<button class="secondary" id="reportNoBtn" ' + (detail.hasSamples === false ? "disabled" : "") + '>Keine Proben</button>' +
      '<button class="secondary" id="deletePharmacyBtn" style="color:#ff3b30">Apotheke löschen</button>' +
      '<p class="error" id="pharmacyActionError" style="display:none"></p>'
    );
  }

  function wirePharmacyDetail(detail) {
    document.getElementById("backToPharmaciesBtn").addEventListener("click", loadPharmaciesList);
    const copyBtn = document.getElementById("copyLinkBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        navigator.clipboard.writeText(detail.checkInURL).then(function () {
          copyBtn.textContent = "Kopiert!";
          setTimeout(function () { copyBtn.textContent = "Link kopieren"; }, 1500);
        }).catch(function () {});
      });
    }
    document.getElementById("reportYesBtn").addEventListener("click", function () { submitPharmacyReport(detail.id, true); });
    document.getElementById("reportNoBtn").addEventListener("click", function () { submitPharmacyReport(detail.id, false); });
    document.getElementById("deletePharmacyBtn").addEventListener("click", async function () {
      if (!window.confirm(detail.name + " wirklich löschen? Alle Meldungen dieser Apotheke werden unwiderruflich gelöscht.")) return;
      try {
        const response = await fetch("/api/pharmacies/" + encodeURIComponent(detail.id), { method: "DELETE" });
        if (response.status === 401) { renderLogin(); return; }
        if (!response.ok) {
          const data = await response.json().catch(function () { return {}; });
          alert(data.error || "Konnte nicht gelöscht werden.");
          return;
        }
        loadPharmaciesList();
      } catch (e) {
        alert("Verbindung fehlgeschlagen.");
      }
    });
  }

  async function submitPharmacyReport(pharmacyID, hasSamples) {
    try {
      const response = await fetch("/api/pharmacies/" + encodeURIComponent(pharmacyID) + "/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hasSamples: hasSamples })
      });
      if (response.status === 401) { renderLogin(); return; }
      if (!response.ok) {
        const data = await response.json().catch(function () { return {}; });
        alert(data.error || "Konnte nicht gespeichert werden.");
        return;
      }
      loadPharmacyDetail(pharmacyID);
    } catch (e) {
      alert("Verbindung fehlgeschlagen.");
    }
  }

  async function downloadReport(endpoint, title, formatLine, emptyMessage, filename) {
    const errorEl = document.getElementById("adminError");
    errorEl.style.display = "none";
    try {
      const response = await fetch(endpoint + "?year=" + adminMonth.year + "&month=" + adminMonth.month);
      if (response.status === 401) { renderLogin(); return; }
      if (response.status === 403) { errorEl.textContent = "Nur für Admins."; errorEl.style.display = "block"; return; }
      if (!response.ok) { errorEl.textContent = "Konnte Auswertung nicht laden."; errorEl.style.display = "block"; return; }
      const data = await response.json();
      const bytes = buildSimplePdfBytes(title, data.lines.map(formatLine), emptyMessage);
      const blob = new Blob([bytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    } catch (e) {
      errorEl.textContent = "Verbindung fehlgeschlagen.";
      errorEl.style.display = "block";
    }
  }

  /**
   * Handgeschriebener, minimaler PDF-Writer statt einer vendorten Bibliothek
   * (pdf-lib o.ä. wäre für "Titel + Zeilenliste auf einer A4-Seite" ein
   * unverhältnismäßig großer, ungeprüfter Blob) - erzeugt eine einzelne
   * A4-Seite mit Helvetica/WinAnsiEncoding, gegen echtes pdftotext verifiziert.
   * Layout absichtlich analog PDFReportRenderer.swift (Titel fett 20pt oben,
   * Zeilen 14pt ab y=90, Schrittweite 24pt) - keine Paginierung, das native
   * Original paginiert auch nicht.
   */
  function pdfEscapeText(text) {
    return String(text).replace(/[\\()]/g, function (c) { return "\\" + c; });
  }

  // Windows-1252 (WinAnsiEncoding) weicht von reinem Latin-1 nur im
  // Byte-Bereich 0x80-0x9F ab - dort sitzen bei Latin-1 nur Steuerzeichen,
  // bei WinAnsi aber echte Glyphen (u.a. Apples "intelligente"
  // Anführungszeichen, Gedankenstriche, Ellipse, Euro-Zeichen). Ohne diese
  // Tabelle würden diese Zeichen zu "?" statt zum korrekten Byte.
  const WIN_ANSI_HIGH_CHARS = {
    0x20ac: 0x80, 0x201a: 0x82, 0x0192: 0x83, 0x201e: 0x84, 0x2026: 0x85,
    0x2020: 0x86, 0x2021: 0x87, 0x02c6: 0x88, 0x2030: 0x89, 0x0160: 0x8a,
    0x2039: 0x8b, 0x0152: 0x8c, 0x017d: 0x8e, 0x2018: 0x91, 0x2019: 0x92,
    0x201c: 0x93, 0x201d: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97,
    0x02dc: 0x98, 0x2122: 0x99, 0x0161: 0x9a, 0x203a: 0x9b, 0x0153: 0x9c,
    0x017e: 0x9e, 0x0178: 0x9f,
  };

  function latin1BytesFromString(str) {
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code <= 255) {
        bytes[i] = code;
      } else if (WIN_ANSI_HIGH_CHARS[code] !== undefined) {
        bytes[i] = WIN_ANSI_HIGH_CHARS[code];
      } else {
        bytes[i] = 0x3f; // "?" für alles, was WinAnsi wirklich nicht darstellen kann
      }
    }
    return bytes;
  }

  function buildSimplePdfBytes(title, lines, emptyMessage) {
    const pageWidth = 595.2;
    const pageHeight = 841.8; // A4 bei 72dpi, wie PDFReportRenderer.swift

    let content = "";
    content += "BT\n/F2 20 Tf\n1 0 0 1 40 " + (pageHeight - 40 - 16).toFixed(1) + " Tm\n(" + pdfEscapeText(title) + ") Tj\nET\n";
    let y = pageHeight - 90 - 11.2;
    const bodyLines = lines.length ? lines : [emptyMessage];
    bodyLines.forEach(function (line) {
      content += "BT\n/F1 14 Tf\n1 0 0 1 40 " + y.toFixed(1) + " Tm\n(" + pdfEscapeText(line) + ") Tj\nET\n";
      y -= 24;
    });

    const objects = [
      "<< /Type /Catalog /Pages 2 0 R >>",
      "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pageWidth.toFixed(1) + " " + pageHeight.toFixed(1) + "] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
      "<< /Length " + content.length + " >>\nstream\n" + content + "endstream",
    ];

    let out = "%PDF-1.4\n";
    const offsets = [0];
    objects.forEach(function (body, i) {
      offsets[i + 1] = out.length;
      out += (i + 1) + " 0 obj\n" + body + "\nendobj\n";
    });

    const xrefOffset = out.length;
    out += "xref\n0 " + (objects.length + 1) + "\n";
    out += "0000000000 65535 f \n";
    for (let i = 1; i <= objects.length; i++) {
      out += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
    }
    out += "trailer\n<< /Size " + (objects.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xrefOffset + "\n%%EOF";

    return latin1BytesFromString(out);
  }

  async function login(password) {
    if (!password) { renderLogin("Bitte Passwort eingeben."); return; }
    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password })
      });
      if (response.status === 401) {
        renderLogin("Falsches Passwort.");
        return;
      }
      if (!response.ok) {
        renderLogin("Verbindung fehlgeschlagen. Bitte erneut versuchen.");
        return;
      }
      await checkSession();
    } catch (e) {
      renderLogin("Verbindung fehlgeschlagen. Bitte erneut versuchen.");
    }
  }

  async function logout() {
    try {
      await fetch("/api/logout", { method: "POST" });
    } catch (e) {
      // Cookie ablaufen lassen reicht notfalls auch - Login-Screen zeigen
      // wir trotzdem, damit niemand auf einem fremden Gerät angemeldet bleibt.
    }
    me = null;
    renderLogin();
  }

  async function checkSession() {
    try {
      const response = await fetch("/api/me");
      if (response.status === 401) {
        renderLogin();
        return;
      }
      if (!response.ok) {
        render('<h1>Probenfahrt</h1><p class="error">Verbindung fehlgeschlagen. Bitte Seite neu laden.</p>', false);
        return;
      }
      me = await response.json();
      surveyReferenceDate = todayDateString();
      calendarReferenceDate = todayDateString();
      samplesDate = todayDateString();
      activeTab = "survey";
      loadCurrentSurveys();
    } catch (e) {
      render('<h1>Probenfahrt</h1><p class="error">Verbindung fehlgeschlagen. Bitte Internetverbindung prüfen und die Seite neu laden.</p>', false);
    }
  }

  checkSession();
})();
</script>
