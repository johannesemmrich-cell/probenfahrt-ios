name: Probenfahrt
options:
  bundleIdPrefix: com.johannesemmrich
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Fest eingetragen (HENEMM GmbH), statt es jedes Mal manuell in Xcode
    # unter Signing & Capabilities auszuwählen — sonst setzt jedes
    # `xcodegen generate` (Probenfahrt.xcodeproj wird komplett neu erzeugt,
    # nicht eingecheckt) das Team wieder auf "None" zurück, weil project.yml
    # bis hierhin keine Team-ID kannte.
    DEVELOPMENT_TEAM: XK87E2B3VR
    ENABLE_PREVIEWS: YES

targets:
  Probenfahrt:
    type: application
    platform: iOS
    sources:
      - path: Probenfahrt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesemmrich.probenfahrt
        PRODUCT_NAME: Probenfahrt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Probenfahrt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # App Store Connect verlangt seit Kurzem alle 4 Ausrichtungen im
        # Bundle (iPad-Multitasking-Kompatibilität, auch für reine
        # iPhone-Apps) — der tatsächliche Portrait-only-Zwang läuft über
        # AppDelegate.supportedInterfaceOrientations(for:) in App.swift.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        CODE_SIGN_ENTITLEMENTS: Probenfahrt/Probenfahrt.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ProbenfahrtTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProbenfahrtTests
    dependencies:
      - target: Probenfahrt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  ProbenfahrtUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ProbenfahrtUITests
    dependencies:
      - target: Probenfahrt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Probenfahrt

schemes:
  Probenfahrt:
    build:
      targets:
        Probenfahrt: all
        ProbenfahrtTests: [test]
        ProbenfahrtUITests: [test]
    test:
      config: Debug
      targets:
        - ProbenfahrtTests
        - ProbenfahrtUITests
    run:
      config: Debug
    archive:
      config: Release
